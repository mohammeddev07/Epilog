name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to deploy, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: epilog-production
  queue: max # Keep waiting production deployments queued.

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://epilog.pages.dev
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out selected release
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Enter an existing stable tag, such as v0.1.0."
            exit 1
          fi
          if ! commit=$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}"); then
            echo "::error::The selected tag does not exist."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/release; then
            echo "::error::The selected tag must be part of the release branch history."
            exit 1
          fi
          git switch --detach "$commit"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Determine release version
        if: github.event_name == 'push'
        id: version
        run: |
          tag=$(node scripts/next-release-tag.mjs)
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - name: Build and check Cloudflare bundles
        run: |
          npm run deploy:check
          npx --no-install wrangler pages functions build --cwd pages --outdir "$RUNNER_TEMP/epilog-pages"
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Deploy Worker and Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          PRIVACY_CONTACT_EMAIL: ${{ secrets.PRIVACY_CONTACT_EMAIL }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in GitHub Actions secrets."
            exit 1
          fi
          if grep -q '<set after' wrangler.jsonc; then
            echo "::error::Run npx wrangler d1 create epilog and set database_id in wrangler.jsonc (see README)."
            exit 1
          fi
          if [[ -f worker/deployment-config.ts ]]; then
            node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs'
          const config = {
            googleClientId: process.env.GOOGLE_CLIENT_ID?.trim() || undefined,
            privacyContactEmail: process.env.PRIVACY_CONTACT_EMAIL?.trim() || undefined,
          }
          writeFileSync('worker/deployment-config.ts', 'export const deploymentConfig = ' + JSON.stringify(config) + '\n')
          JS
          fi
          unset GOOGLE_CLIENT_ID PRIVACY_CONTACT_EMAIL
          npx --no-install wrangler d1 migrations apply epilog --remote
          npx --no-install wrangler deploy
          npx --no-install wrangler pages deploy --cwd pages --branch release

  release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish release notes and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.deploy.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
